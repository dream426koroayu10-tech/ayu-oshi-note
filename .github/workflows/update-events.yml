name: Update Eventernote events

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 日本時間 6:00(GitHubはUTC指定のため21:00)
  workflow_dispatch:        # Actionsタブから手動実行もできる
    inputs:
      force:
        description: "件数が一致しなくても保存する(通常はオフのまま)"
        type: boolean
        default: false

permissions:
  contents: write           # events.json をコミットするために必要

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch events from Eventernote (件数が一致したときだけ保存)
        env:
          ALLOW_MISMATCH: ${{ inputs.force && '1' || '0' }}
        run: python sync_events.py

      - name: Commit events.json if changed
        run: |
          if [ -z "$(git status --porcelain events.json)" ]; then
            echo "events.json に変更はありません"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "Update events.json"
            git push
          fi
